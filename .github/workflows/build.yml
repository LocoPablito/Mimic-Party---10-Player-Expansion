name: Build and validate Expansion
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: LocoPablito/MimicParty-Modding
          ref: 46c03672bab67ed32a060198ec8f2d56d3fdfd6a
          path: _deps/MimicParty-Modding
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Compile source and run regression tests
        shell: pwsh
        env:
          MIMIC_PARTY_CORE_PROJECT: ${{ github.workspace }}\_deps\MimicParty-Modding\src\MimicParty.ModdingCore\MimicParty.ModdingCore.csproj
        run: |
          ./build.ps1
          if ($LASTEXITCODE) { throw 'Build failed' }
          python tests/validate_release_package.py
          if ($LASTEXITCODE) { throw 'Source package validation failed' }
          dotnet run --project tests/HookContractTests -c Release -f net8.0
          if ($LASTEXITCODE) { throw 'Contract tests failed' }
