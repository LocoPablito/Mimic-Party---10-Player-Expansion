name: Build private interop analysis tool
on:
  pull_request:
    paths:
      - 'tools/InteropLab/**'
      - '.github/workflows/interop-lab.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Publish isolated metadata analysis tool
        run: dotnet publish tools/InteropLab/InteropLab.csproj -c Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=6.0.7 -o interop-lab
      - name: Preserve license and tool source
        run: |
          cp tools/InteropLab/Program.cs interop-lab/
          cp tools/InteropLab/InteropLab.csproj interop-lab/
          cp "$HOME/.nuget/packages/dnlib/4.5.0/LICENSE.txt" interop-lab/DNLIB_LICENSE.txt
      - uses: actions/upload-artifact@v6
        with:
          name: interop-analysis-linux-net6
          path: interop-lab/
          if-no-files-found: error
          retention-days: 7
