name: One-time authorized release cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-release-cleanup.yml']
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove archived development reference and obsolete tool downloads
        shell: python
        run: |
          import json, subprocess, os, urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path,method='GET'):
              p=subprocess.run(['gh','api','-X',method,'repos/'+repo+'/'+path],text=True,capture_output=True)
              if p.returncode: raise RuntimeError(p.stderr)
              return json.loads(p.stdout) if p.stdout.strip() else None
          assert not api('releases/tags/v1.1.2')['draft']
          assert api('pulls/1')['merged']
          name='fix/sep11-classic-versus-10'
          present={b['name']:b for b in api('branches?per_page=100')}
          if name in present:
              assert present[name]['commit']['sha']=='02ba38842b7ea78d9584e7e6cd6e0d7266bf764b' and not present[name]['protected']
              api('git/refs/heads/'+urllib.parse.quote(name,safe=''),'DELETE')
              print('Removed backed-up merged development branch.')
          names={'interop-analysis-linux-net6','FIX5-Windows-script-validation','FIX6-contract-probe','Expansion-author-development-archive'}
          artifacts=[];page=1
          while True:
              batch=api('actions/artifacts?per_page=100&page='+str(page))['artifacts']
              artifacts.extend(batch)
              if len(batch)<100: break
              page+=1
          for a in artifacts:
              if a['name'] in names:
                  api('actions/artifacts/'+str(a['id']),'DELETE')
                  print('Removed retired tool artifact:',a['id'],a['name'])
          print('Versioned public assets, pinned runtime build artifacts and Git history retained.')
